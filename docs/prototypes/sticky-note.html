<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mico — Sticky note prototype</title>
  <style>
    :root {
      --canvas: #f5fafc;
      --grid: #dceaf1;
      --paper: #fff8d4;
      --ink: #2b3038;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font: 14px/1.5 system-ui, sans-serif;
      background-color: var(--canvas);
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 64px 64px;
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    .note {
      position: relative;
      width: 160px;
      height: 160px;
      isolation: isolate;
      transform-origin: 50% 20%;
      animation: stick 700ms cubic-bezier(.2, .7, .2, 1) both;
    }

    .note::before {
      content: "";
      position: absolute;
      z-index: -1;
      right: 3px;
      bottom: 1px;
      width: 65%;
      height: 18px;
      border-radius: 50%;
      background: rgba(43, 48, 56, .28);
      filter: blur(5px);
      transform: translate(4px, 5px) rotate(-3deg);
    }

    .paper {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 12px;
      overflow: hidden;
      border-radius: 4px 4px 12px 4px / 4px 4px 5px 4px;
      background:
        radial-gradient(ellipse 52px 25px at 100% 100%, rgba(255, 255, 255, .72), transparent 80%),
        linear-gradient(175deg, rgba(255, 255, 255, .16), transparent 40%, rgba(187, 157, 73, .08)),
        var(--paper);
      box-shadow: 0 2px 4px rgba(43, 48, 56, .12);
    }

    .paper::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: 0;
      width: 52px;
      height: 18px;
      border-radius: 100% 0 0 0;
      background: linear-gradient(165deg, transparent 35%, rgba(159, 134, 72, .12) 75%, rgba(255, 255, 255, .38));
      pointer-events: none;
    }

    .replay {
      position: fixed;
      right: 24px;
      bottom: 24px;
      padding: 8px 14px;
      border: 1px solid #dce4e9;
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      cursor: pointer;
    }

    .replay:focus-visible { outline: 2px solid #00a2e1; outline-offset: 3px; }

    @keyframes stick {
      0% { opacity: 0; transform: translateY(-9px) scale(1.035) rotate(-.8deg); }
      65% { opacity: 1; transform: translateY(1px) scale(.996) rotate(.15deg); }
      100% { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .note { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="note">
      <div class="paper">A little space<br>for good ideas.</div>
    </div>
  </main>
  <button class="replay" type="button" onclick="location.reload()">Replay animation</button>
</body>
</html>
