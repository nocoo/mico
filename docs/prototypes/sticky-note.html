<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mico — Sticky note prototype</title>
  <style>
    :root {
      --canvas: #f5fafc;
      --grid: #dceaf1;
      --paper: #fff8d4;
      --ink: #2b3038;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font: 14px/1.5 system-ui, sans-serif;
      background-color: var(--canvas);
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 64px 64px;
    }

    main {
      min-width: 1440px;
      min-height: max(100vh, 1440px);
      display: grid;
      place-items: center;
    }

    .note {
      width: 1280px;
      height: 1280px;
      overflow: visible;
      transform-origin: 50% 20%;
      animation: stick 1.15s cubic-bezier(.2, .7, .2, 1) both;
    }

    .outline {
      animation: curl 1.15s ease-in-out both;
    }

    .paper {
      fill: var(--paper);
      filter: drop-shadow(0 1px 1.5px rgba(43, 48, 56, .1));
    }

    .corner-light {
      fill: url(#corner-light);
      opacity: .35;
      animation: curl 1.15s ease-in-out both, light 1.15s ease-in-out both;
    }

    .corner-shadow {
      fill: var(--ink);
      opacity: .12;
      filter: blur(2px);
      transform-origin: 139px 157px;
      animation: shadow 1.15s ease-in-out both;
    }

    .replay {
      position: fixed;
      right: 24px;
      bottom: 24px;
      padding: 8px 14px;
      border: 1px solid #dce4e9;
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      cursor: pointer;
    }

    .replay:focus-visible { outline: 2px solid #00a2e1; outline-offset: 3px; }

    @keyframes stick {
      0% { opacity: 0; transform: perspective(5600px) translate3d(0, -56px, 112px) rotateX(5deg) rotateZ(-.5deg); }
      40% { opacity: 1; transform: perspective(5600px) translate3d(0, 0, 0) rotateX(0) rotateZ(0); }
      100% { opacity: 1; transform: perspective(5600px) translate3d(0, 0, 0) rotateX(0) rotateZ(0); }
    }

    @keyframes curl {
      0%, 35%, 100% { d: path("M4 0 H156 Q160 0 160 4 V153 Q160 157 156 157 Q145 157 130 160 Q118 160 105 160 H4 Q0 160 0 156 V4 Q0 0 4 0 Z"); }
      65% { d: path("M4 0 H156 Q160 0 160 4 V145 Q160 150 156 151 Q145 152 129 157 Q118 160 105 160 H4 Q0 160 0 156 V4 Q0 0 4 0 Z"); }
    }

    @keyframes light {
      0%, 35%, 100% { opacity: .35; }
      65% { opacity: .7; }
    }

    @keyframes shadow {
      0%, 35%, 100% { opacity: .12; transform: none; }
      65% { opacity: .2; transform: translateY(3px) scale(1.15, 1.5); }
    }

    @media (prefers-reduced-motion: reduce) {
      .note, .outline, .corner-light, .corner-shadow { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <svg class="note" viewBox="0 0 160 160" role="img" aria-label="A little space for good ideas">
      <defs>
        <radialGradient id="corner-light" cx="150" cy="155" r="52" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 77.5) scale(1 .5)">
          <stop stop-color="#fff" stop-opacity=".8"/>
          <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <ellipse class="corner-shadow" cx="139" cy="157" rx="22" ry="2.5"/>
      <path class="paper outline" d="M4 0 H156 Q160 0 160 4 V153 Q160 157 156 157 Q145 157 130 160 Q118 160 105 160 H4 Q0 160 0 156 V4 Q0 0 4 0 Z"/>
      <path class="corner-light" d="M4 0 H156 Q160 0 160 4 V153 Q160 157 156 157 Q145 157 130 160 Q118 160 105 160 H4 Q0 160 0 156 V4 Q0 0 4 0 Z"/>
      <text x="12" y="26" fill="var(--ink)" font-size="14" font-family="system-ui, sans-serif">
        <tspan x="12">A little space</tspan>
        <tspan x="12" dy="21">for good ideas.</tspan>
      </text>
    </svg>
  </main>
  <button class="replay" type="button" onclick="location.reload()">Replay animation</button>
</body>
</html>
