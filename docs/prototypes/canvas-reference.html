<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<style>
:root { color-scheme: light; --bg: oklch(0.975 0.012 290); --dot: oklch(0.55 0.08 285 / .2); --aurora-o: .85; --grain-o: .05; }
*, *::before, *::after { box-sizing: border-box; }
html, body { block-size: 100%; margin: 0; }
body { background: var(--bg); overflow: hidden; }
.aurora { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; opacity: var(--aurora-o); }
.aurora i { position: absolute; inline-size: 62vmax; block-size: 62vmax; border-radius: 50%; background: radial-gradient(closest-side, var(--b), transparent); animation: drift 26s ease-in-out infinite alternate; }
.aurora i:nth-child(1) { --b: oklch(0.88 0.09 296 / .7); inset-inline-start: -18vmax; inset-block-start: -22vmax; }
.aurora i:nth-child(2) { --b: oklch(0.9 0.08 200 / .6); inset-inline-end: -16vmax; inset-block-start: -10vmax; animation-duration: 32s; animation-delay: -8s; }
.aurora i:nth-child(3) { --b: oklch(0.91 0.08 20 / .55); inset-inline-start: 18vmax; inset-block-end: -34vmax; animation-duration: 38s; animation-delay: -14s; }
.aurora i:nth-child(4) { --b: oklch(0.93 0.09 105 / .45); inset-inline-end: 8vmax; inset-block-end: -30vmax; animation-duration: 30s; animation-delay: -4s; }
@keyframes drift { to { translate: 7vmax 5vmax; scale: 1.12; } }
.grain { position: fixed; inset: 0; inline-size: 100%; block-size: 100%; z-index: 70; pointer-events: none; opacity: var(--grain-o); mix-blend-mode: multiply; }
#stage { position: fixed; inset: 0; z-index: 1; overflow: hidden; touch-action: none; cursor: default; background-image: radial-gradient(circle, var(--dot) 1.15px, transparent 1.7px); background-size: var(--gs, 24px) var(--gs, 24px); background-position: var(--gx, 0) var(--gy, 0); }
@media (prefers-reduced-motion: reduce) { .aurora i { animation: none; } }
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i><i></i></div>
<main id="stage"></main>
<svg class="grain" aria-hidden="true"><filter id="grainf"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.3  0 0 0 0 0.45  0 0 0 0.9 0"/></filter><rect width="100%" height="100%" filter="url(#grainf)"/></svg>
</body>
</html>
