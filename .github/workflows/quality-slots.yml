# System1 quality slots, native mode (system1-quality v1.3.0, base-ci v2026.18).
#
# Every slot is a top-level job named exactly "<ID>: <Name>", so the caller
# (ci.yml job `quality`) renders `quality / S1: Types` ... `quality / Z1: Gate`.
# L2 Runtime is declared `na` and stays skipped; P1 Package builds and smoke-tests the Docker image.
name: Quality slots

on:
  workflow_call:

permissions:
  contents: read
  actions: read

env:
  PNPM_VERSION: "11.6.0"
  NODE_VERSION: "26.13.0"
  NO_COLOR: "1"

jobs:
  s1-types:
    name: "S1: Types"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@bfaac83b5a4d5c7ed26320bb5b09f3ca0a01932c # v2026.18
        with:
          package-manager: pnpm
          runtime-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-policy: blocked
      - name: TypeScript check
        run: pnpm run typecheck
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  s2-lint:
    name: "S2: Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@bfaac83b5a4d5c7ed26320bb5b09f3ca0a01932c # v2026.18
        with:
          package-manager: pnpm
          runtime-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-policy: blocked
      - name: Biome check-only (0 error / 0 warning)
        run: pnpm run lint
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  s3-workflow:
    name: "S3: Workflow"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/lint-workflows@bfaac83b5a4d5c7ed26320bb5b09f3ca0a01932c # v2026.18
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  g1-secrets:
    name: "G1: Secrets"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: nocoo/base-ci/.github/actions/scan-secrets@bfaac83b5a4d5c7ed26320bb5b09f3ca0a01932c # v2026.18
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  g2-dependencies:
    name: "G2: Dependencies"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/scan-dependencies@bfaac83b5a4d5c7ed26320bb5b09f3ca0a01932c # v2026.18
        with:
          lockfiles: "pnpm-lock.yaml"
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  b1-build:
    name: "B1: Build"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@bfaac83b5a4d5c7ed26320bb5b09f3ca0a01932c # v2026.18
        with:
          package-manager: pnpm
          runtime-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-policy: blocked
      - name: Build production bundle
        run: pnpm exec vite build
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l1-unit:
    name: "L1: Unit"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@bfaac83b5a4d5c7ed26320bb5b09f3ca0a01932c # v2026.18
        with:
          package-manager: pnpm
          runtime-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-policy: blocked
      - name: Run unit tests
        run: pnpm run test:unit
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l2-runtime:
    name: "L2: Runtime"
    if: ${{ vars.ENABLE_L2_RUNTIME == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "N/A — plain Node runtime; node:sqlite is exercised inside L1 and L3"

  l3-integration:
    name: "L3: Integration"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@bfaac83b5a4d5c7ed26320bb5b09f3ca0a01932c # v2026.18
        with:
          package-manager: pnpm
          runtime-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-policy: blocked
      - name: Run integration tests
        run: pnpm run test:integration
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l4-e2e:
    name: "L4: E2E"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@bfaac83b5a4d5c7ed26320bb5b09f3ca0a01932c # v2026.18
        with:
          package-manager: pnpm
          runtime-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-policy: blocked
      - uses: nocoo/base-ci/.github/actions/setup-playwright@bfaac83b5a4d5c7ed26320bb5b09f3ca0a01932c # v2026.18
        with:
          package-manager: pnpm
          browsers: chromium
      - name: Run browser E2E smoke suite
        run: pnpm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-evidence
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  p1-package:
    name: "P1: Package"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build production Docker image
        run: |
          DOCKER_BUILDKIT=1 docker build \
            --build-arg NPM_REGISTRY=https://registry.npmjs.org/ \
            -t mico:p1 \
            .
      - name: Run container package smoke check
        run: |
          set -euo pipefail
          CONTAINER_NAME="mico-p1-smoke-${GITHUB_RUN_ID:-local}"
          cleanup() {
            docker logs "$CONTAINER_NAME" >/dev/null 2>&1 || true
            docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d \
            --name "$CONTAINER_NAME" \
            --init \
            --read-only \
            --tmpfs /tmp \
            --tmpfs /data:uid=1000,gid=1000 \
            --tmpfs /home/node/.config/mico:uid=1000,gid=1000 \
            --cap-drop ALL \
            -p 127.0.0.1:47063:47063 \
            -e MICO_RUNTIME=laptop \
            -e MAGPIE_BASE_URL=http://127.0.0.1:9/v1 \
            mico:p1

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:47063/api/live | grep -q '"status":"ok"'; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:47063/api/live | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:47063/ | grep -q '<title>'

          curl -fsS http://127.0.0.1:47063/api/state | python3 -c "
          import json, sys
          s = json.load(sys.stdin)
          assert len(s['canvases']) == 1
          assert len(s['board']['shapes']) == 0
          "

          curl -fsS -X POST http://127.0.0.1:47063/api/operations \
            -H 'Origin: http://127.0.0.1:47063' \
            -H 'Content-Type: application/json' \
            -d '{"operations":[{"type":"create","shape":{"id":"p1-note","type":"note","x":100,"y":100,"w":160,"h":120,"color":"#fff8d4","text":"P1 smoke verified"}}]}' >/dev/null

          curl -fsS http://127.0.0.1:47063/api/board | grep -q 'P1 smoke verified'

          for blocked in /.env /package.json /src/server/index.ts /api/missing; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:47063${blocked}")
            test "$code" = "404"
          done
          evil_code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: https://evil.example' http://127.0.0.1:47063/api/state)
          test "$evil_code" = "403"

          test "$(docker exec "$CONTAINER_NAME" id -u)" = "1000"
          docker exec "$CONTAINER_NAME" node src/cli/index.ts board get | grep -q 'P1 smoke verified'
          docker exec "$CONTAINER_NAME" node -e "const fs=require('node:fs'); if(fs.existsSync('/app/.env')||fs.existsSync('/app/node_modules/vite')) process.exit(1)"
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  z1-gate:
    name: "Z1: Gate"
    if: always()
    needs:
      - s1-types
      - s2-lint
      - s3-workflow
      - g1-secrets
      - g2-dependencies
      - b1-build
      - l1-unit
      - l2-runtime
      - l3-integration
      - l4-e2e
      - p1-package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tested-sha: ${{ steps.gate.outputs.tested-sha }}
    steps:
      - id: gate
        uses: nocoo/base-ci/.github/actions/z1-gate@bfaac83b5a4d5c7ed26320bb5b09f3ca0a01932c # v2026.18
        with:
          needs-json: ${{ toJSON(needs) }}
          expected-sha: ${{ github.sha }}
          required-jobs: |
            s1-types=S1: Types
            s2-lint=S2: Lint
            s3-workflow=S3: Workflow
            g1-secrets=G1: Secrets
            g2-dependencies=G2: Dependencies
            b1-build=B1: Build
            l1-unit=L1: Unit
            l3-integration=L3: Integration
            l4-e2e=L4: E2E
            p1-package=P1: Package
          skipped-jobs: |
            l2-runtime=L2: Runtime
