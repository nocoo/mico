name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@777bbe4f9bacab8a91d8c01974480a6ee23d28e0 # v2026.15
    with:
      package-manager: pnpm
      runtime-version: "11.6.0"
      node-version: "26.13.0"
      install-policy: blocked
      lint-command: pnpm run lint
      typecheck-command: pnpm run typecheck
      test-command: pnpm run test:unit
      build: true
      build-command: pnpm run build
      workflow-lint: true
      workflow-lint-required-workflow: nocoo/base-ci/.github/workflows/quality.yml
      l3-integration: true
      l2-command: pnpm run test:integration
      l4: true
      l4-command: pnpm run test:e2e
      l4-browsers: chromium
      l4-artifact-name: e2e-evidence
      l4-artifact-path: playwright-report/
      slot-status: >-
        {"S1":{"status":"impl"},
        "S2":{"status":"impl"},
        "S3":{"status":"impl"},
        "G1":{"status":"impl"},
        "G2":{"status":"impl"},
        "B1":{"status":"impl"},
        "L1":{"status":"impl"},
        "L2":{"status":"na","reason":"plain Node runtime; node:sqlite is exercised inside L1 and L3"},
        "L3":{"status":"impl"},
        "L4":{"status":"impl"},
        "P1":{"status":"na","reason":"private package; nothing is published or installed downstream"},
        "Z1":{"status":"impl"}}
